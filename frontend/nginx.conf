server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # Hashed asset filenames are immutable, so they can be cached indefinitely.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /traces/ {
    add_header Cache-Control "public, max-age=3600";
  }

  # index.html must not be cached, or a deploy leaves clients on old asset names.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # Proxy the API so the browser stays same-origin: no CORS preflight, and the
  # WebSocket upgrade needs no client-side origin configuration.
  #
  # Harmless in a STATIC=1 build: that bundle contains no /api calls at all, so
  # nothing arrives here.
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Generation streams one message per token; buffering would batch them into
    # a single late flush and defeat the whole point of the WebSocket.
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Required for the upgrade to /api/ws/generate.
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
